<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14120e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Terra Cinza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen handheld console. Header strip, pixel screen, touch pads below (beside it in landscape). Single dark look by design. */
:root{
  --bg:#14120e; --panel:#1f1b15; --line:#3a3226; --ink:#eadfc8; --muted:#a39579; --rust:#d0692f; --toxic:#9bd651;
  --f-display:"Silkscreen","Courier New",monospace; --f-body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.brand{font-family:var(--f-display);font-size:18px;letter-spacing:.06em;margin:0;font-weight:700}
.brand span{color:var(--rust)}
.tools{display:flex;gap:8px}
.tool{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
.tool:hover{color:var(--ink)}
.tool:focus-visible,.btn:focus-visible{outline:2px solid var(--toxic);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;background:#000;border:2px solid var(--line);border-radius:6px;box-shadow:0 0 0 4px var(--panel)}
.hint{flex:none;margin:0;font-size:13px;color:var(--muted);text-align:center;line-height:1.8}
.hint kbd{font-family:var(--f-display);font-size:10px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--ink)}
.pads{display:none;flex:none;justify-content:space-between;align-items:center;height:168px}
body.touch .pads{display:flex}
body.touch .hint{display:none}
.stick{width:136px;height:136px;border-radius:50%;background:var(--panel);border:2px solid var(--line);position:relative;touch-action:none}
.stick::after{content:"";position:absolute;inset:30%;border-radius:50%;border:1px dashed var(--line)}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--line);border:2px solid var(--muted);z-index:1}
.btns{display:flex;gap:14px;align-items:flex-end}
.btn{width:70px;height:70px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--f-display);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;padding:0}
.btn small{font-family:var(--f-body);font-size:10px;color:var(--muted);letter-spacing:.04em}
.btn.a{width:82px;height:82px;border-color:var(--rust);margin-bottom:30px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.btn.sw{width:58px;height:30px;border-radius:15px;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.btn.on{background:var(--line)}
@media (orientation:landscape) and (max-height:540px){
  body.touch header{display:none}
  body.touch #stage{padding-inline:150px}
  body.touch .pads{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));height:auto;pointer-events:none}
  body.touch .pads>*{pointer-events:auto}
  .stick{width:124px;height:124px}
}
@media (prefers-reduced-motion:reduce){.tool,.btn{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1 class="brand">TERRA <span>CINZA</span></h1>
    <div class="tools">
      <button class="tool" id="btnSound" type="button">SOM: ON</button>
      <button class="tool" id="btnPause" type="button">PAUSA</button>

    <div class="stick" id="stick" aria-label="Direcional"><div class="knob" id="knob"></div></div>
    <div class="btns">

    if(c==='L'&&f[id+':unlock'])m[y][x]='_';
    if(c==='G'&&gateOn(id[0]))m[y][x]='_';
    if(c==='E'&&gateOn(id[0]))m[y][x]='e';

  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,ty);if(solidFor(c,kind))return {c,tx:clamp(tx,0,COLS-1),ty:clamp(ty,0,ROWS-1)};}return null;}

  if(dx){const h=boxSolid(e.x+dx,e.y,e.w,e.h,kind);if(!h&&!blockedByNpc(e,e.x+dx,e.y))e.x+=dx;else{hit=h||{c:'npc'};
    if(e===G.p&&!dy){for(const s of[-1,1]){if(!boxSolid(e.x+dx,e.y+s*5,e.w,e.h,kind)&&!boxSolid(e.x,e.y+s,e.w,e.h,kind)){e.y+=s*Math.min(1,Math.abs(dx)*.8+.3);break;}}}}}
  if(dy){const h=boxSolid(e.x,e.y+dy,e.w,e.h,kind);if(!h&&!blockedByNpc(e,e.x,e.y+dy))e.y+=dy;else{hit=hit||h||{c:'npc'};

function spawn(type,x,y){const b=ETPL[type];return {type,x,y,w:b.w,h:b.h,hp:b.hp,maxHp:b.hp,dmg:b.dmg,armor:!!b.armor,stun:0,t:rnd(0,3),vx:0,vy:0,dt:0,kbx:0,kby:0,kbt:0,inv:0,flash:0,cd:rnd(1.2,2.6),st:'walk',stt:0,face:1};}

  if(r.bossFlag&&f[r.bossFlag]&&!f[r.reward])G.picks.push(pick(r.reward,128,80,true));

function useItem(){const s=G.save;if(s.item==='hook'&&s.hook)fireHook();else shoot();}
function swapItem(){const s=G.save;if(s.hook&&s.sling){s.item=s.item==='hook'?'sling':'hook';sfx('talk');G.banner={name:s.item==='hook'?'Gancho':'Estilingue',t:1};}}
function fireHook(){const p=G.p;if(G.hook)return;const [dx,dy]=DIRS[p.dir];G.hook={dx,dy,len:0,st:'out',grab:null,t:0,sx:p.x,sy:p.y};sfx('shoot');}
function hookOrigin(){const p=G.p,h=G.hook;return {x:p.x+h.dx*5,y:p.y-3+h.dy*4};}
function updateHook(dt){const h=G.hook,p=G.p;h.t+=dt;
  if(h.st==='out'){h.len+=240*dt;const o=hookOrigin(),tx=o.x+h.dx*h.len,ty=o.y+h.dy*h.len;
    const t=boxSolid(tx,ty,4,4,'shot');
    if(t){if(t.c==='H'){h.st='pull';h.tx=tx;h.ty=ty;sfx('key');}else{h.st='back';sparks(tx,ty,'#cfc6b8');sfx('thud');}return;}
    const tip={x:tx,y:ty,w:7,h:7};
    for(const e of G.ents){if(e.dead||e.type==='npc')continue;if(overlap(tip,e)){h.st='back';sparks(tx,ty,P.gold);
      if(e.type==='boss'){sfx('thud');return;}
      e.stun=e.armor?(e.type==='carapaca'?(e.hp<=e.maxHp/2?1.7:2.3):2.6):1.3;e.flash=.2;if(e.type==='carapaca'){e.st='walk';e.stt=0;}sfx('hit');return;}}
    for(const k of G.picks){if(overlap(tip,k)){h.grab=k;h.st='back';return;}}
    if(h.len>=92)h.st='back';}
  else if(h.st==='back'){h.len-=300*dt;if(h.grab){const o=hookOrigin(),l=Math.max(0,h.len);h.grab.x=o.x+h.dx*l;h.grab.y=o.y+h.dy*l+3;}if(h.len<=0)G.hook=null;}
  else if(h.st==='pull'){p.inv=Math.max(p.inv,.15);const hit=move(p,h.dx*210*dt,h.dy*210*dt,'fly');
    if(hit||h.t>1.6){G.hook=null;if(boxSolid(p.x,p.y,p.w,p.h,'walk')){p.x=h.sx;p.y=h.sy;}}}}
function shoot(){const p=G.p;if(!G.save.sling){if(G.lockMsgT<=0){say(['Você ainda não tem nada para atirar.','A Vó Iara falou de um baú perto do lago verde...']);}return;}
  if(p.shootCd>0)return;if(G.save.scrap<=0){sfx('thud');G.banner={name:'Sem sucata!',t:1.2};return;}
  G.save.scrap--;p.shootCd=.32;const [dx,dy]=DIRS[p.dir];G.shots.push({x:p.x+dx*8,y:p.y+dy*8-2,vx:dx*190,vy:dy*190,w:4,h:4,t:0,life:1.1,mine:true,dmg:1});sfx('shoot');}
function tryUnlock(){if(G.save.keys>0){G.save.keys--;G.save.flags[G.room+':unlock']=true;for(const row of G.tiles)for(let i=0;i<row.length;i++)if(row[i]==='L')row[i]='_';sfx('door');G.shake=.15;writeSave();}
  else if(G.lockMsgT<=0){G.lockMsgT=4;say(['A porta está trancada.','Talvez algum guardião deste andar carregue um cartão de acesso.']);}}

/* ---------- dialog ---------- */
function say(lines){G.dlg={lines,i:0,shown:0};G.lockMsgT=3;}
function winGame(){G.state='win';G.winT=0;sfx('win');}
function npcLines(){const s=G.save,f=s.flags;
  if(!s.flags.talked){s.flags.talked=true;return ['Ravi! Graças à poeira, você voltou.','A tempestade de cinzas arrancou o NÚCLEO DE FUSÃO do nosso gerador. Sem ele, o acampamento congela em poucos dias.','Os batedores viram uma luz verde no BUNKER 7, ao nordeste. Pegue sua chave inglesa e vá.','E escute: perto do lago verde, a noroeste, ficou um baú com um estilingue velho.'];}
  if(f.core&&f.coil){G.afterDlg=winGame;return ['O Núcleo e a Bobina! Ravi, você conseguiu!','Deixa comigo: encaixo tudo no gerador antes do anoitecer.'];}
  if(f.coil)return ['Uma bobina de ignição nova! Agora só falta o NÚCLEO DE FUSÃO, lá no Bunker 7, a nordeste.'];
  if(f.core){const l=['Você trouxe o Núcleo! Mas quando abri o gerador, a BOBINA DE IGNIÇÃO estava derretida.','A única bobina inteira que conheço está na USINA AFOGADA, ao sul, depois do rio ácido.'];
    l.push(s.hook?'Com esse gancho, mire nos postes de ferro da outra margem e ele puxa você.':'Ninguém atravessa aquele rio a nado. No Bunker 7 havia um gancho de escalada, numa sala a oeste.');return l;}
  if(!s.sling)return ['O lago verde fica a noroeste daqui. Procure o baú.','Use a chave inglesa (A) para cortar entulho e afastar os bichos.'];
  if(s.maxHp<8)return ['Esse estilingue gasta sucata. Junte o que os bichos e os entulhos soltarem.','Dizem que na clareira espinhosa, a sudeste, há algo cercado por mato de ferro.'];
  return ['O bunker fica a nordeste. Olhos vermelhos nas paredes reagem a tiros...','Volte inteiro, Ravi.'];}

/* ---------- input ---------- */
const keys={};const touch={x:0,y:0,a:false,b:false,sw:false};let prevA=false,prevB=false,prevS=false;
const KA=['KeyJ','Space','KeyZ','Enter'],KB=['KeyK','KeyX'];
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();ensureAudio();keys[e.code]=true;
  if(e.code==='KeyP'||e.code==='Escape')togglePause();if(e.code==='KeyM')toggleSound();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function readInput(){let x=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),y=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(!x&&!y){x=touch.x;y=touch.y;}const aD=KA.some(k=>keys[k])||touch.a,bD=KB.some(k=>keys[k])||touch.b;const sD=keys.KeyQ||keys.KeyL||touch.sw;const r={x,y,a:aD&&!prevA,b:bD&&!prevB,sw:sD&&!prevS};prevA=aD;prevB=bD;prevS=sD;return r;}
/* touch */
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;
function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.38;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;touch.x=dx/max;touch.y=dy/max;}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
const stickEnd=e=>{if(e.pointerId!==stickId)return;stickId=null;touch.x=touch.y=0;knob.style.transform='';};
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
function bindBtn(id,k){const b=document.getElementById(id);const on=e=>{e.preventDefault();touch[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};const off=()=>{touch[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault());}
bindBtn('btnA','a');bindBtn('btnB','b');bindBtn('btnSw','sw');
document.addEventListener('pointerdown',ensureAudio);
function markTouch(){if(!document.body.classList.contains('touch')){document.body.classList.add('touch');resize();}}
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
addEventListener('touchstart',markTouch,{passive:true});
cv.addEventListener('pointerdown',e=>{if(G.state==='title'||G.state==='dead'||G.state==='win'){touch.a=true;setTimeout(()=>touch.a=false,80);}});
const btnSound=document.getElementById('btnSound'),btnPause=document.getElementById('btnPause');
function toggleSound(){AU.on=!AU.on;btnSound.textContent='SOM: '+(AU.on?'ON':'OFF');}
function togglePause(){if(G.state==='play'||G.state==='dialog'){G.paused=!G.paused;btnPause.textContent=G.paused?'VOLTAR':'PAUSA';}}
btnSound.addEventListener('click',toggleSound);btnPause.addEventListener('click',togglePause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!G.paused&&(G.state==='play'))togglePause();});

/* ---------- flow ---------- */
function startGame(fresh){if(fresh){clearSave();G.save=newSave();}else{G.save=loadSave()||newSave();}
  G.p=newPlayer();G.p.hp=G.save.hp>0?G.save.hp:G.save.maxHp;G.state='play';G.paused=false;G.banner=null;
  enterRoom(G.save.room in ROOMS?G.save.room:'o1,1',G.save.px,G.save.py);
  if(fresh)say(['Terra Cinza, ano 41 depois do Apagão.','Você é Ravi, catador de sucata do Acampamento Brasa. Fale com a Vó Iara (A).']);}
function respawn(){G.save.hp=G.save.maxHp;G.p=newPlayer();G.p.hp=G.save.maxHp;G.state='play';G.banner=null;enterRoom('o1,1',120,100);}
function edgeExit(){const p=G.p;let dir=null;if(p.x<1)dir=[-1,0];else if(p.x>VW-1)dir=[1,0];else if(p.y<1)dir=[0,-1];else if(p.y>PH-1)dir=[0,1];if(!dir)return;
  const c=parseId(G.room),to=c.a+(c.x+dir[0])+','+(c.y+dir[1]);if(!ROOMS[to]){p.x=clamp(p.x,6,VW-6);p.y=clamp(p.y,6,PH-6);return;}
  const nx=dir[0]<0?VW-7:dir[0]>0?7:p.x,ny=dir[1]<0?PH-7:dir[1]>0?7:p.y;
  G.trans={from:G.room,fromTiles:G.tiles,toTiles:buildTiles(to),to,dir,t:0,dur:.55,sx:p.x,sy:p.y,nx,ny};G.state='trans';G.shots=[];}
function checkWarp(){const p=G.p,c=tileAt(Math.floor(p.x/TS),Math.floor(p.y/TS)),w=ROOMS[G.room].warp;if(w&&w[c]){G.fade={t:0,to:w[c].room,x:w[c].x,y:w[c].y,done:false};G.state='fade';sfx('door');}}

/* ---------- update ---------- */
function update(dt){
  G.t+=dt;if(G.lockMsgT>0)G.lockMsgT-=dt;if(G.shake>0)G.shake-=dt;if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  const inp=readInput();
  if(G.state==='title'){if(inp.a)startGame(!G.hadSave);else if(inp.b&&G.hadSave)startGame(true);return;}
  if(G.state==='dead'){G.deadT+=dt;if(G.deadT>.8&&inp.a)respawn();return;}
  if(G.state==='win'){G.winT+=dt;if(G.winT>1.5&&inp.a){clearSave();G.hadSave=false;G.state='title';}return;}
  if(G.paused)return;
  updateParts(dt);
  if(G.state==='trans'){const tr=G.trans;tr.t+=dt;if(tr.t>=tr.dur){G.state='play';G.trans=null;enterRoom(tr.to,tr.nx,tr.ny);}return;}
  if(G.state==='fade'){const f=G.fade;f.t+=dt;if(f.t>=.3&&!f.done){f.done=true;enterRoom(f.to,f.x,f.y);G.p.dir=f.to[0]==='d'?'up':'down';}if(f.t>=.6){G.state='play';G.fade=null;}return;}
  if(G.dlg){G.state='dialog';const d=G.dlg,line=d.lines[d.i];if(d.shown<line.length){d.shown=Math.min(line.length,d.shown+dt*55);if(((d.shown*.5)|0)!==(((d.shown-dt*55)*.5)|0))sfx('talk');if(inp.a)d.shown=line.length;}
    else if(inp.a){d.i++;d.shown=0;if(d.i>=d.lines.length){G.dlg=null;G.state='play';prevA=true;if(G.afterDlg){const fn=G.afterDlg;G.afterDlg=null;fn();}}}return;}
  G.save.time+=dt;
  const p=G.p;p.inv=Math.max(0,p.inv-dt);p.shootCd-=dt;
  if(inp.sw)swapItem();
  if(p.kbt>0){p.kbt-=dt;move(p,p.kbx*dt,p.kby*dt,'walk');}
  else if(G.hook){updateHook(dt);}
  else if(p.swing>0){p.swing-=dt;updateSwing();}
  else{let ix=inp.x,iy=inp.y;const m=Math.hypot(ix,iy);
    if(m>.25){if(m>1){ix/=m;iy/=m;}if(Math.abs(ix)>Math.abs(iy)*1.05)p.dir=ix>0?'right':'left';else p.dir=iy>0?'down':'up';
      const hit=move(p,ix*74*dt,iy*74*dt,'walk');p.moving=true;p.anim+=dt;if(hit&&hit.c==='L')tryUnlock();}
    else p.moving=false;
    if(inp.a){const n=G.ents.find(e=>e.type==='npc'&&Math.hypot(e.x-p.x,e.y-p.y)<24);if(n){say(npcLines());writeSave();return;}startSwing();}
    else if(inp.b)useItem();}
  edgeExit();if(G.state!=='play')return;checkWarp();if(G.state!=='play')return;
  updateEnts(dt);updateShots(dt);updatePicks(dt);
  const r=ROOMS[G.room];if(r.clearKey&&G.roomHadEnemies&&!G.save.flags[G.room+':key']&&!G.keySpawned&&!G.ents.some(e=>e.type!=='npc')){G.keySpawned=G.room;G.picks.push(pick('key',128,88,true));sfx('key');}
  if(G.keySpawned&&G.keySpawned!==G.room)G.keySpawned=false;
}
function toward(e,tx,ty,sp,dt,kind){const dx=tx-e.x,dy=ty-e.y,m=Math.hypot(dx,dy)||1;e.face=dx>=0?1:-1;return move(e,dx/m*sp*dt,dy/m*sp*dt,kind);}
function clampRoom(e){e.x=clamp(e.x,e.w/2+2,VW-e.w/2-2);e.y=clamp(e.y,e.h/2+2,PH-e.h/2-2);}
function updateEnts(dt){const p=G.p;
  for(const e of G.ents){if(e.dead||e.type==='npc')continue;e.t+=dt;e.inv=Math.max(0,e.inv-dt);e.flash=Math.max(0,e.flash-dt);
    const kind=e.type==='drone'?'fly':'walk';
    if(e.kbt>0){e.kbt-=dt;move(e,e.kbx*dt,e.kby*dt,kind);clampRoom(e);continue;}
    if(e.stun>0){e.stun-=dt;clampRoom(e);continue;}
    const dist=Math.hypot(p.x-e.x,p.y-e.y);
    if(e.type==='rat'){e.dt-=dt;if(e.dt<=0){e.dt=rnd(.5,1.4);if(dist<70&&Math.random()<.55){const dx=p.x-e.x,dy=p.y-e.y;if(Math.abs(dx)>Math.abs(dy)){e.vx=Math.sign(dx);e.vy=0;}else{e.vx=0;e.vy=Math.sign(dy);}}else{const d=[[1,0],[-1,0],[0,1],[0,-1],[0,0]][(Math.random()*5)|0];e.vx=d[0];e.vy=d[1];}if(e.vx)e.face=e.vx;}
      if(move(e,e.vx*46*dt,e.vy*46*dt,kind))e.dt=0;}
    else if(e.type==='drone'){if(dist<100)toward(e,p.x+Math.sin(e.t*2)*14,p.y,34,dt,kind);else move(e,Math.cos(e.t)*14*dt,Math.sin(e.t*1.3)*14*dt,kind);}
    else if(e.type==='spitter'){e.cd-=dt;e.face=p.x>=e.x?1:-1;if(e.cd<=0&&dist<150){e.cd=rnd(2,2.8);const dx=p.x-e.x,dy=p.y-e.y,m=Math.hypot(dx,dy)||1;G.shots.push({x:e.x,y:e.y-3,vx:dx/m*72,vy:dy/m*72,w:5,h:5,t:0,life:2.4,mine:false,dmg:1,goo:true});sfx('shoot');}}
    else if(e.type==='beetle'){if(dist<90)toward(e,p.x,p.y,30,dt,kind);else{e.dt-=dt;if(e.dt<=0){e.dt=rnd(.8,1.6);const d=[[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0];e.vx=d[0];e.vy=d[1];if(e.vx)e.face=e.vx;}if(move(e,e.vx*24*dt,e.vy*24*dt,kind))e.dt=0;}}
    else if(e.type==='carapaca')updateCarapaca(e,dt);
    else if(e.type==='boss')updateBoss(e,dt);
    clampRoom(e);
    if(overlap(e,p))hurtPlayer(e.dmg,e.x,e.y);}
  G.ents=G.ents.filter(e=>!e.dead);}
function updateBoss(e,dt){const p=G.p,rage=e.hp<=e.maxHp/2;e.stt+=dt;
  if(e.st==='walk'){toward(e,p.x,p.y,rage?42:30,dt,'walk');if(e.stt>(rage?1.5:2.2)){e.st='wind';e.stt=0;sfx('boss');}}
  else if(e.st==='wind'){if(e.stt>.65){const dx=p.x-e.x,dy=p.y-e.y,m=Math.hypot(dx,dy)||1;e.cx=dx/m;e.cy=dy/m;e.st='charge';e.stt=0;}}
  else if(e.st==='charge'){const hit=move(e,e.cx*(rage?185:160)*dt,e.cy*(rage?185:160)*dt,'walk');if(hit){e.st='stun';e.stt=0;G.shake=.35;sfx('thud');puff(e.x+e.cx*12,e.y+e.cy*10,12,P.rockL);}else if(e.stt>1.3){e.st='shoot';e.stt=0;}}
  else if(e.st==='stun'){if(e.stt>1.3){e.st='shoot';e.stt=0;}}
  else if(e.st==='shoot'){const n=rage?12:8,off=rnd(0,1);for(let i=0;i<n;i++){const a=(i+off)/n*Math.PI*2;G.shots.push({x:e.x,y:e.y-6,vx:Math.cos(a)*80,vy:Math.sin(a)*80,w:5,h:5,t:0,life:3,mine:false,dmg:1,bolt:true});}sfx('shoot');e.st='walk';e.stt=0;}}
function updateCarapaca(e,dt){const p=G.p,rage=e.hp<=e.maxHp/2;e.stt+=dt;
  if(e.st==='walk'){toward(e,p.x,p.y,rage?34:24,dt,'walk');if(e.stt>(rage?1.4:2)){e.st='zap';e.stt=0;sfx('boss');}}
  else if(e.st==='zap'){if(e.stt>.55){const n=rage?8:4,off=Math.random()<.5?0:.5;for(let i=0;i<n;i++){const a=(i+off)/n*Math.PI*2;G.shots.push({x:e.x,y:e.y-8,vx:Math.cos(a)*85,vy:Math.sin(a)*85,w:5,h:5,t:0,life:3,mine:false,dmg:1,zap:true});}
    sfx('shoot');const dx=p.x-e.x,dy=p.y-e.y,m=Math.hypot(dx,dy)||1;e.cx=dx/m;e.cy=dy/m;e.st='charge';e.stt=0;}}
  else if(e.st==='charge'){const sp=rage?150:120,hit=move(e,e.cx*sp*dt,e.cy*sp*dt,'walk');if(hit||e.stt>1.1){if(hit){G.shake=.25;sfx('thud');}e.st='walk';e.stt=0;}}
  else{e.st='walk';e.stt=0;}}
function updateShots(dt){const p=G.p;
  for(const s of G.shots){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.t>s.life||s.x<-8||s.x>VW+8||s.y<-8||s.y>PH+8){s.dead=true;continue;}
    const h=boxSolid(s.x,s.y,s.w,s.h,'shot');
    if(h){s.dead=true;sparks(s.x,s.y,s.mine?'#cfc6b8':P.toxL);if(s.mine&&h.c==='E'&&!gateOn(G.room[0])){G.save.flags['gate:'+G.room[0]]=true;let here=false;for(const row of G.tiles)for(let i=0;i<row.length;i++){if(row[i]==='E')row[i]='e';if(row[i]==='G'){row[i]='_';here=true;}}sfx('door');G.shake=.3;G.banner={name:here?'Um portão se abriu!':'Um portão rangeu ao longe...',t:2.4};writeSave();}continue;}
    if(s.mine){for(const e of G.ents){if(e.dead||e.type==='npc')continue;if(overlap(s,e)){hurtEnemy(e,s.dmg,s.x-s.vx,s.y-s.vy);s.dead=true;sparks(s.x,s.y,'#fff1b8');break;}}}
    else if(overlap(s,p)){hurtPlayer(s.dmg,s.x-s.vx*.1,s.y-s.vy*.1);s.dead=true;}}
  G.shots=G.shots.filter(s=>!s.dead);}
function updatePicks(dt){const p=G.p,s=G.save;
  for(const k of G.picks){k.t+=dt;if(k.t>k.life){k.dead=true;continue;}
    if(k.t>.25&&overlap(k,p)){k.dead=true;
      if(k.kind==='heart'){p.hp=Math.min(s.maxHp,p.hp+2);sfx('pick');}
      else if(k.kind==='scrap'){s.scrap=Math.min(30,s.scrap+(1+((Math.random()*2)|0)));sfx('pick');}
      else if(k.kind==='key'){s.keys++;s.flags[G.room+':key']=true;sfx('key');say(['CARTÃO DE ACESSO obtido!','Ele abre uma porta trancada deste bunker.']);}
      else if(k.kind==='core'){s.flags.core=true;sfx('key');say(['NÚCLEO DE FUSÃO recuperado!','Leve-o de volta ao acampamento e fale com a Vó Iara.']);}
      else if(k.kind==='coil'){s.flags.coil=true;sfx('key');say(['BOBINA DE IGNIÇÃO recuperada!','Volte ao acampamento e fale com a Vó Iara.']);}
      s.hp=p.hp;writeSave();}}
  G.picks=G.picks.filter(k=>!k.dead);}
function updateParts(dt){for(const q of G.parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;}G.parts=G.parts.filter(q=>q.t<q.life);}

/* ---------- render ---------- */
function drawRoom(tiles,id,ox,oy){TH=THEMES[id[0]]||THEMES.d;const dun=id[0]!=='o',sd=id.length*7+id.charCodeAt(1)*13+id.charCodeAt(3)*29;

function drawWrench(x,y,dir,swing,behind){const back=dir==='up';if(behind!==back)return;

  if(k>.25&&k<.8){ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle='#fff1b8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(Math.round(x),Math.round(y-3),13,base-1.1,a);ctx.stroke();ctx.restore();}}

    M(step?-4:-3,-1,2,1,'#2a211b');M(step?2:1,-1,2,1,'#2a211b');}
  else if(e.type==='drone'){const bob=Math.sin(e.t*6)*1.5,yy=Math.round(fy-12+bob),f=((e.t*30)|0)%2;R('rgba(0,0,0,.3)',x-4,fy-1,8,2);
    R('#3c434c',x-5,yy-2,10,7);R('#6b737d',x-4,yy-3,8,6);R('#8b939d',x-4,yy-3,8,1);R(((e.t*3)|0)%2?P.red:'#ff9a7a',x-1,yy,3,2);R('#3c434c',x-8,yy-2,3,1);R('#3c434c',x+5,yy-2,3,1);

function drawBoss(e,x,fy){const sh=e.st==='wind'?(Math.random()*2-1)|0:0;x+=sh;R('rgba(0,0,0,.35)',x-14,fy-2,28,4);

function drawCarapaca(e,x,fy){const rage=e.hp<=e.maxHp/2;R('rgba(0,0,0,.35)',x-15,fy-2,30,4);
  if(e.stun>0){blob(x,fy-9,12,'#a8936a');blob(x,fy-10,11,'#d6c49a');R('#b8a57a',x-1,fy-20,2,18);for(let i=0;i<6;i++){const w=((e.t*12+i)|0)%2;R('#2a211b',x-11+i*4,fy-25-w*2,2,6);}

  const step=((e.t*8)|0)%2;for(let i=0;i<4;i++)R('#1a1410',x-12+i*7,fy-3-(step===(i%2)?1:0),3,3);

function drawHook(){const h=G.hook;if(!h)return;const o=hookOrigin();let tx,ty;if(h.st==='pull'){tx=h.tx;ty=h.ty;}else{const l=Math.max(0,h.len);tx=o.x+h.dx*l;ty=o.y+h.dy*l;}
  const n=Math.max(1,Math.floor(Math.hypot(tx-o.x,ty-o.y)/4));for(let i=0;i<n;i++){const x=o.x+(tx-o.x)*i/n,y=o.y+(ty-o.y)*i/n;R(i%2?'#8b939d':'#5a6270',Math.round(x)-1,Math.round(y)-1,2,2);}
  const x=Math.round(tx),y=Math.round(ty);R('#1a1410',x-3,y-3,6,6);R(P.gold,x-2,y-2,4,4);R('#fff1b8',x-2,y-2,1,1);}
function drawPick(k){if(k.life-k.t<3&&((k.t*10)|0)%2)return;const x=Math.round(k.x),y=Math.round(k.y+Math.sin(k.t*4)*1.5);

function drawParts(){for(const q of G.parts){ctx.globalAlpha=1-q.t/q.life;R(q.c,Math.round(q.x),Math.round(q.y),q.sz,q.sz);}ctx.globalAlpha=1;}
function battery(x,y,fill){R('#1a1410',x,y,11,7);R('#1a1410',x+11,y+2,2,3);R('#3a3226',x+1,y+1,9,5);if(fill>0)R(fill>1?P.toxL:P.gold,x+1,y+1,fill>1?9:4,5);if(fill>1)R('#d8ff9a',x+1,y+1,9,1);}

function wrap(s,maxW){ctx.font=`8px ${FONT}`;const words=s.split(' ');const out=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;}if(cur)out.push(cur);return out;}

function render(){ctx.setTransform(SCALE,0,0,SCALE,0,0);ctx.imageSmoothingEnabled=false;R('#000',0,0,VW,VH);

}

/* ---------- loop ---------- */
function resize(){const st=document.getElementById('stage'),cs=getComputedStyle(st);const w=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-12,h=st.clientHeight-12;
  const s=Math.max(.5,Math.min(w/VW,h/VH));cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';
  const dpr=window.devicePixelRatio||1;SCALE=clamp(Math.ceil(s*dpr),2,6);cv.width=VW*SCALE;cv.height=VH*SCALE;}
addEventListener('resize',resize);
let last=performance.now();
function pickMusic(){let m=null;if(!G.paused&&['play','dialog','trans','fade'].includes(G.state)){const id=G.state==='trans'?G.trans.to:G.room,r=ROOMS[id];m=r.bossFlag&&!G.save.flags[r.bossFlag]?'boss':id[0]==='o'?'over':'dun';}setMusic(m);}
function frame(now){const dt=Math.min(1/30,(now-last)/1000);last=now;update(dt);pickMusic();render();requestAnimationFrame(frame);}
resize();
(document.fonts&&document.fonts.load?document.fonts.load(`8px ${FONT}`).catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(t=>{last=t;frame(t);}));
})();
</script>
